name: CD - OmniSphere SDK (Data Library)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: omnisphere-sdk-deploy
  cancel-in-progress: true

jobs:
  rebuild-sdk:
    name: Rebuild Base SDK Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild SDK Base Image via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '2202' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            TARGET_DIR="${{ secrets.TARGET_DIR || '/src' }}"

            echo "=================================================="
            echo " 0. Clonando / Actualizando repositorios del SDK"
            echo "=================================================="
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            if [ ! -d "$TARGET_DIR/cppgraphqlgen/.git" ]; then
              echo "--> Clonando cppgraphqlgen (con submódulos)..."
              git clone --recursive "https://github.com/microsoft/cppgraphqlgen.git" "$TARGET_DIR/cppgraphqlgen" 2>/dev/null || true
            else
              (cd "$TARGET_DIR/cppgraphqlgen" && git pull origin main 2>/dev/null && git submodule update --init --recursive 2>/dev/null || true)
            fi

            for d in OmniUtils OmniData OmniCore OmniERP OmniRoute OmniGraph; do
              if [ ! -d "$TARGET_DIR/$d/.git" ]; then
                echo "--> Clonando $d..."
                git clone "https://github.com/Omni-Sphere/$d.git" "$TARGET_DIR/$d" 2>/dev/null || true
              else
                cd "$TARGET_DIR/$d"
                (git checkout main 2>/dev/null || git checkout master 2>/dev/null || true)
                git pull origin $(git branch --show-current 2>/dev/null || echo "main") 2>/dev/null || true
              fi
            done

            echo "=================================================="
            echo " 1. Rebuilding Base SDK Image (localhost/omnisphere-sdk:latest)"
            echo "=================================================="
            if [ -f "$TARGET_DIR/OmniCore/Dockerfile" ]; then
              podman build -t localhost/omnisphere-sdk:latest -f "$TARGET_DIR/OmniCore/Dockerfile" "$TARGET_DIR"
            elif [ -f "$TARGET_DIR/Dockerfile" ]; then
              podman build -t localhost/omnisphere-sdk:latest -f "$TARGET_DIR/Dockerfile" "$TARGET_DIR"
            else
              echo "Error: Base SDK Dockerfile no encontrado"
              exit 1
            fi
            podman tag localhost/omnisphere-sdk:latest omnisphere-sdk:latest || true

            echo "=================================================="
            echo " 2. Checking Database Migration (OmniRoute.sql)"
            echo "=================================================="
            SQL_FILE="$TARGET_DIR/OmniGraph/GraphQL/Route/OmniRoute.sql"
            if [ -f "$SQL_FILE" ] && podman ps --format '{{.Names}}' | grep -q '^omniroute-db-dev$'; then
              echo "--> Aplicando migración OmniRoute.sql..."
              podman exec -i omniroute-db-dev psql -U system -d OmniRoute < "$SQL_FILE" 2>/dev/null || true
            fi

            echo "=================================================="
            echo " Base SDK Rebuild Complete!"
            echo "=================================================="

