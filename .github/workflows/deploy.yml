name: CD - OmniSphere SDK (Data Library)

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: omnisphere-sdk-deploy
  cancel-in-progress: true

jobs:
  deploy-sdk:
    name: Rebuild SDK Base & Deploy API (main)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Rebuild SDK Base Image & Deploy via SSH (Key Auth Only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '2202' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            echo "=================================================="
            echo " Rebuilding SDK Base Image for Branch: main"
            echo "=================================================="

            cd /home/arodriguez/Proyectos

            echo "--> Pulling latest changes in all SDK library repositories..."
            for d in OmniUtils OmniData OmniCore OmniERP OmniRoute OmniGraph; do
              if [ -d "$d/.git" ]; then
                (cd "$d" && (git checkout main 2>/dev/null || git checkout master 2>/dev/null) && (git pull origin main 2>/dev/null || git pull origin master 2>/dev/null)) || true
              fi
            done

            echo "=================================================="
            echo " 1. Rebuilding Base SDK Image (localhost/omnisphere-sdk:latest)"
            echo "=================================================="
            podman build -t localhost/omnisphere-sdk:latest -f Dockerfile .
            podman tag localhost/omnisphere-sdk:latest omnisphere-sdk:latest || true

            echo "=================================================="
            echo " 2. Rebuilding OmniRouteAPI Image (omniroute-api-dev)"
            echo "=================================================="
            (cd /home/arodriguez/Proyectos/OmniRouteAPI && podman build -t omniroute-api-dev -f Dockerfile .)

            echo "=================================================="
            echo " 3. Restarting Container (omniroute-api-dev) & Nginx Proxy"
            echo "=================================================="
            (podman restart omniroute-api-dev || podman restart omniroute-api-prod || true)
            (podman restart nginx-proxy || podman run -d \
              --name nginx-proxy \
              --network omnisphere-dev-net \
              --restart always \
              -p 80:80 \
              -p 443:443 \
              -v /home/arodriguez/Proyectos/nginx.conf:/etc/nginx/nginx.conf:ro,Z \
              -v /home/arodriguez/Proyectos/podman-proxy/certbot/conf:/etc/letsencrypt:ro,Z \
              -v /home/arodriguez/Proyectos/podman-proxy/certbot/www:/var/www/certbot:ro,Z \
              docker.io/library/nginx:alpine || true)

            echo "=================================================="
            echo " SDK & OmniRouteAPI Deployment Complete!"
            echo "=================================================="
